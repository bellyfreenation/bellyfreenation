<script>

/*
============================================================
BELLY FREE NATION
CUSTOMER INVOICE
============================================================

The invoice information is stored in the URL after #.

Example:

customer-invoice.html#eyJuYW1lIjoiU3VzaG1h...

The customer will NOT see:
name=
amount=
period=
date=

============================================================
*/


function decodeInvoice() {

    const hash =
        window.location.hash.substring(1);

    if (!hash) {

        showError();

        return;

    }


    try {

        /*
        Decode the information
        */

        const decoded =
            decodeURIComponent(
                atob(hash)
            );


        const invoice =
            JSON.parse(decoded);


        /*
        Display customer name
        */

        document.getElementById(
            "client-name"
        ).textContent =
            invoice.name;


        /*
        Display invoice number
        */

        document.getElementById(
            "invoice-number"
        ).textContent =
            "Invoice #" + invoice.invoice;


        /*
        Display billing period
        */

        document.getElementById(
            "billing-period"
        ).textContent =
            invoice.period;


        /*
        Display invoice date
        */

        document.getElementById(
            "invoice-date"
        ).textContent =
            invoice.date;


        /*
        Format amount
        */

        const formattedAmount =
            "₹" +
            Number(invoice.amount)
            .toLocaleString("en-IN");


        /*
        Display amount
        */

        document.getElementById(
            "subtotal"
        ).textContent =
            formattedAmount;


        document.getElementById(
            "amount-due"
        ).textContent =
            formattedAmount;


        /*
        Update browser title
        */

        document.title =
            "Belly Free Nation | Invoice " +
            invoice.invoice;


    } catch (error) {

        showError();

    }

}


/*
============================================================
SHOW ERROR
============================================================
*/

function showError() {

    document.getElementById(
        "invoice-container"
    ).innerHTML = `

        <div class="error">

            <h2>
                Invoice Not Found
            </h2>

            <p>
                The invoice link may be incorrect
                or incomplete.
            </p>

        </div>

    `;

}


/*
============================================================
LOAD INVOICE
============================================================
*/

decodeInvoice();

</script>
