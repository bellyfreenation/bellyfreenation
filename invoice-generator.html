<script>


function generateInvoice() {


    /*
    GET CUSTOMER DETAILS
    */

    const name =
        document
        .getElementById("customerName")
        .value
        .trim();


    const invoice =
        document
        .getElementById("invoiceNumber")
        .value
        .trim();


    const amount =
        document
        .getElementById("amount")
        .value
        .trim();


    const period =
        document
        .getElementById("billingPeriod")
        .value
        .trim();


    const date =
        document
        .getElementById("invoiceDate")
        .value
        .trim();


    /*
    CHECK FIELDS
    */

    if (
        !name ||
        !invoice ||
        !amount ||
        !period ||
        !date
    ) {

        alert(
            "Please fill in all fields."
        );

        return;

    }


    /*
    CREATE INVOICE OBJECT
    */

    const invoiceData = {

        name: name,

        invoice: invoice,

        amount: amount,

        period: period,

        date: date

    };


    /*
    CONVERT INVOICE DATA
    INTO A CLEAN URL CODE
    */

    const json =
        JSON.stringify(invoiceData);


    const encoded =
        btoa(
            encodeURIComponent(json)
        );


    /*
    CREATE CUSTOMER URL
    */

    const customerLink =
        window.location.origin +
        window.location.pathname
        .replace(
            "invoice-generator.html",
            "customer-invoice.html"
        ) +
        "#" +
        encoded;


    /*
    SHOW PREVIEW
    */

    document
    .getElementById("previewName")
    .textContent =
        name;


    document
    .getElementById("previewInvoice")
    .textContent =
        invoice;


    document
    .getElementById("previewAmount")
    .textContent =
        Number(amount)
        .toLocaleString("en-IN");


    document
    .getElementById("previewPeriod")
    .textContent =
        period;


    document
    .getElementById("previewDate")
    .textContent =
        date;


    document
    .getElementById("preview")
    .style.display =
        "block";


    /*
    SHOW CUSTOMER LINK
    */

    document
    .getElementById("generatedLink")
    .value =
        customerLink;


    document
    .getElementById("result")
    .style.display =
        "block";


    document
    .getElementById("success")
    .style.display =
        "none";

}


/*
============================================================
COPY LINK
============================================================
*/

function copyLink() {

    const link =
        document
        .getElementById("generatedLink");


    link.focus();

    link.select();

    link.setSelectionRange(
        0,
        link.value.length
    );


    try {

        const successful =
            document.execCommand("copy");


        if (successful) {

            document
            .getElementById("success")
            .style.display =
                "block";

        }

    } catch (error) {

        alert(
            "Please select and copy the link manually."
        );

    }

}

</script>
