<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Belly Free Nation | Invoice Generator</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #f3f5f1;

    color: #252525;
}


.container {

    max-width: 600px;

    margin: 40px auto;

    padding: 20px;
}


.box {

    background: #ffffff;

    border-radius: 14px;

    padding: 35px;

    box-shadow:
        0 8px 30px rgba(0,0,0,0.08);
}


h1 {

    margin: 0;

    color: #174A35;

    font-size: 26px;

    letter-spacing: 0.5px;
}


.subtitle {

    margin-top: 8px;

    margin-bottom: 30px;

    color: #777;

    font-size: 14px;
}


label {

    display: block;

    margin-top: 18px;

    margin-bottom: 7px;

    font-size: 12px;

    color: #666;

    font-weight: bold;

    text-transform:
        uppercase;

    letter-spacing: 0.5px;
}


input {

    width: 100%;

    padding: 13px 14px;

    border:
        1px solid #d5d5d5;

    border-radius: 8px;

    font-size: 15px;

    outline: none;
}


input:focus {

    border-color:
        #174A35;
}


.generate-button {

    width: 100%;

    margin-top: 28px;

    padding: 15px;

    background: #174A35;

    color: #ffffff;

    border: none;

    border-radius: 8px;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;
}


.generate-button:hover {

    background: #0f3928;
}


.result {

    display: none;

    margin-top: 30px;

    padding: 20px;

    background: #f5f8f4;

    border:
        1px solid #dfe8df;

    border-radius: 10px;
}


.result-title {

    color: #174A35;

    font-weight: bold;

    margin-bottom: 12px;
}


.link-input {

    background: #ffffff;

    font-size: 13px;

    margin-bottom: 10px;
}


.copy-button {

    width: 100%;

    padding: 13px;

    background: #174A35;

    color: #ffffff;

    border: none;

    border-radius: 8px;

    font-size: 14px;

    font-weight: bold;

    cursor: pointer;
}


.copy-button:hover {

    background: #0f3928;
}


.open-button {

    display: block;

    width: 100%;

    margin-top: 10px;

    padding: 13px;

    background: #ffffff;

    color: #174A35;

    border:
        1px solid #174A35;

    border-radius: 8px;

    font-size: 14px;

    font-weight: bold;

    text-align: center;

    text-decoration: none;

    cursor: pointer;
}


.open-button:hover {

    background: #f3f5f1;
}


.success {

    display: none;

    margin-top: 12px;

    color: #174A35;

    font-size: 13px;

    font-weight: bold;
}


.preview {

    display: none;

    margin-top: 20px;

    padding: 15px;

    background: #ffffff;

    border:
        1px solid #e5e5e5;

    border-radius: 8px;

    font-size: 14px;

    line-height: 1.8;
}


.preview strong {

    color: #174A35;
}


/* MOBILE */

@media (max-width: 600px) {

    .container {

        margin: 15px auto;

        padding: 10px;
    }


    .box {

        padding:
            25px 20px;
    }

}

</style>

</head>


<body>


<div class="container">


<div class="box">


<h1>
BELLY FREE NATION
</h1>


<div class="subtitle">
Invoice Link Generator
</div>


<!-- CUSTOMER NAME -->

<label>
Customer Name
</label>

<input
    type="text"
    id="customerName"
    placeholder="e.g. Sushma Reddy"
>


<!-- INVOICE NUMBER -->

<label>
Invoice Number
</label>

<input
    type="text"
    id="invoiceNumber"
    placeholder="e.g. BFN-003"
>


<!-- AMOUNT -->

<label>
Amount
</label>

<input
    type="number"
    id="amount"
    placeholder="e.g. 5000"
>


<!-- BILLING PERIOD -->

<label>
Billing Period
</label>

<input
    type="text"
    id="billingPeriod"
    placeholder="e.g. Oct 1 - Oct 31, 2026"
>


<!-- INVOICE DATE -->

<label>
Invoice Date
</label>

<input
    type="text"
    id="invoiceDate"
    placeholder="e.g. Oct 1, 2026"
>


<!-- GENERATE BUTTON -->

<button
    class="generate-button"
    onclick="generateInvoice()">

    GENERATE INVOICE LINK

</button>


<!-- PREVIEW -->

<div
    class="preview"
    id="preview">


    <strong>
        Invoice Preview
    </strong>


    <br>


    Customer:

    <span id="previewName">
    </span>


    <br>


    Invoice:

    <span id="previewInvoice">
    </span>


    <br>


    Amount:

    ₹<span id="previewAmount">
    </span>


    <br>


    Period:

    <span id="previewPeriod">
    </span>


    <br>


    Date:

    <span id="previewDate">
    </span>


</div>


<!-- RESULT -->

<div
    class="result"
    id="result">


    <div class="result-title">

        Customer Invoice Link

    </div>


    <input
        type="text"
        id="generatedLink"
        class="link-input"
        readonly>


    <button
        class="copy-button"
        onclick="copyLink()">

        COPY LINK

    </button>


    <a
        href="#"
        id="openInvoice"
        class="open-button">

        OPEN INVOICE

    </a>


    <div
        class="success"
        id="success">

        ✓ Link copied successfully!

    </div>


</div>


</div>


</div>



<script>

/*
============================================================
GENERATE INVOICE
============================================================
*/

function generateInvoice() {


    /*
    GET VALUES
    */

    const name =
        document
        .getElementById("customerName")
        .value
        .trim();


    const invoice =
        document
        .getElementById("invoiceNumber")
        .value
        .trim();


    const amount =
        document
        .getElementById("amount")
        .value
        .trim();


    const period =
        document
        .getElementById("billingPeriod")
        .value
        .trim();


    const date =
        document
        .getElementById("invoiceDate")
        .value
        .trim();


    /*
    CHECK FIELDS
    */

    if (
        !name ||
        !invoice ||
        !amount ||
        !period ||
        !date
    ) {

        alert(
            "Please fill in all fields."
        );

        return;

    }


    /*
    CREATE INVOICE DATA
    */

    const invoiceData = {

        name: name,

        invoice: invoice,

        amount: amount,

        period: period,

        date: date

    };


    /*
    CONVERT TO JSON
    */

    const json =
        JSON.stringify(
            invoiceData
        );


    /*
    ENCODE DATA
    */

    const encoded =
        btoa(
            encodeURIComponent(
                json
            )
        );


    /*
    CREATE CUSTOMER LINK
    */

    const customerLink =
        window.location.origin +
        window.location.pathname
        .replace(
            "invoice-generator.html",
            "customer-invoice.html"
        ) +
        "#" +
        encoded;


    /*
    SHOW PREVIEW
    */

    document
    .getElementById(
        "previewName"
    )
    .textContent =
        name;


    document
    .getElementById(
        "previewInvoice"
    )
    .textContent =
        invoice;


    document
    .getElementById(
        "previewAmount"
    )
    .textContent =
        Number(amount)
        .toLocaleString("en-IN");


    document
    .getElementById(
        "previewPeriod"
    )
    .textContent =
        period;


    document
    .getElementById(
        "previewDate"
    )
    .textContent =
        date;


    document
    .getElementById(
        "preview"
    )
    .style.display =
        "block";


    /*
    SHOW LINK
    */

    document
    .getElementById(
        "generatedLink"
    )
    .value =
        customerLink;


    document
    .getElementById(
        "result"
    )
    .style.display =
        "block";


    /*
    MAKE OPEN BUTTON
    WORK
    */

    document
    .getElementById(
        "openInvoice"
    )
    .href =
        customerLink;


    /*
    HIDE OLD SUCCESS MESSAGE
    */

    document
    .getElementById(
        "success"
    )
    .style.display =
        "none";

}


/*
============================================================
COPY LINK
============================================================
*/

function copyLink() {


    const link =
        document
        .getElementById(
            "generatedLink"
        );


    link.focus();

    link.select();

    link.setSelectionRange(
        0,
        link.value.length
    );


    try {


        const successful =
            document.execCommand(
                "copy"
            );


        if (successful) {


            document
            .getElementById(
                "success"
            )
            .style.display =
                "block";


        } else {


            alert(
                "Please copy the selected link manually."
            );


        }


    }


    catch (error) {


        alert(
            "Please copy the selected link manually."
        );


    }

}

</script>


</body>

</html>
